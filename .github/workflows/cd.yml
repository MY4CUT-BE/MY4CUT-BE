name: CD - Deploy to EC2

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build JAR
        run: ./gradlew clean build -x test

      - name: Set image tag
        run: echo "SHA_SHORT=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Build & Push Docker Image
        run: |
          docker build \
            -t "hilees/my4cut:prod-${SHA_SHORT}" \
            -t hilees/my4cut:prod-latest .
          docker push "hilees/my4cut:prod-${SHA_SHORT}"
          docker push hilees/my4cut:prod-latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script_stop: true
          command_timeout: 15m
          script: |
            set -eu
            cd ~/deploy
            export IMAGE_TAG="prod-$(printf '%.7s' '${{ github.sha }}')"
            echo '${{ secrets.DOCKER_ACCESS_TOKEN }}' | \
              docker login \
                --username '${{ secrets.DOCKER_USERNAME }}' \
                --password-stdin
            docker compose pull api
            docker compose up -d api

            for attempt in $(seq 1 40); do
              if curl --fail --silent --show-error \
                http://127.0.0.1:8080/v3/api-docs > /dev/null; then
                echo "Deployment health check passed"
                docker image prune -f
                exit 0
              fi
              sleep 3
            done

            echo "Deployment health check failed"
            docker compose logs --tail 150 api
            exit 1
