services:
  mysql:
    image: mysql:8.0
    container_name: my4cut-local-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: my4cutdb
      MYSQL_USER: 4cutuser
      MYSQL_PASSWORD: 4cutuser
      TZ: Asia/Seoul
    ports:
      - "3307:3306"
    volumes:
      - my4cut_mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+09:00

  redis:
    image: redis
    container_name: my4cut-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  my4cut_mysql_data: