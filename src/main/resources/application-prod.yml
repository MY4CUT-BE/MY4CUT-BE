server:
  port: 8080
  forward-headers-strategy: framework

spring:
  application:
    name: my4cut

  datasource:
    url: ${DB_URL}?useSSL=false&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # prod에서는 validate 또는 none
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 55MB

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

jwt:
  token:
    secretKey: ${JWT_SECRET_KEY}



cloud:
  aws:
    region: ap-northeast-2
    s3:
      bucket: my4cut-image-bucket

resend:
  api-key: ${RESEND_API_KEY}
  connect-timeout: ${RESEND_CONNECT_TIMEOUT:3s}
  read-timeout: ${RESEND_READ_TIMEOUT:5s}

mail:
  from: ${MAIL_FROM}

firebase:
  enabled: ${FIREBASE_ENABLED:true}
  config-path: ${FIREBASE_CONFIG_PATH:}

media:
  cleanup:
    pending-delete-fixed-delay-ms: 300000

notification:
  cleanup:
    retention-days: ${NOTIFICATION_CLEANUP_RETENTION_DAYS:30}
    zone: ${NOTIFICATION_CLEANUP_ZONE:Asia/Seoul}
    cron: ${NOTIFICATION_CLEANUP_CRON:0 0 4 * * *}
    batch-size: ${NOTIFICATION_CLEANUP_BATCH_SIZE:1000}
