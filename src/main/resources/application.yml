
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update   # 개발 단계
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
    defer-datasource-initialization: true


  application:
    name: my4cut

  profiles:
    default: local

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 55MB

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# ec2 서버
#server:
#  port: ${SERVER_PORT:8080}

#localhost
server:
  port: 8080

jwt:
  token:
    secretKey: ${JWT_SECRET_KEY}

cloud:
  aws:
    s3:
      bucket: my4cut-image-bucket   # 실제 버킷명

resend:
  api-key: ${RESEND_API_KEY}
  connect-timeout: ${RESEND_CONNECT_TIMEOUT:3s}
  read-timeout: ${RESEND_READ_TIMEOUT:5s}

mail:
  from: ${MAIL_FROM}

media:
  cleanup:
    pending-delete-fixed-delay-ms: 300000

notification:
  cleanup:
    retention-days: ${NOTIFICATION_CLEANUP_RETENTION_DAYS:30}
    zone: ${NOTIFICATION_CLEANUP_ZONE:Asia/Seoul}
    cron: ${NOTIFICATION_CLEANUP_CRON:0 0 4 * * *}
    batch-size: ${NOTIFICATION_CLEANUP_BATCH_SIZE:1000}
