spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

JWT_SECRET_KEY: "test_secret_key_test_secret_key_test_secret_key_test_secret_key"
DB_URL: "jdbc:h2:mem:testdb"
DB_USERNAME: "sa"
DB_PASSWORD: ""

resend:
  api-key: test_resend_api_key
  connect-timeout: 1s
  read-timeout: 1s

mail:
  from: "MY4CUT <noreply@example.com>"

firebase:
  enabled: false
  config-path: src/test/resources/firebase-test.json

cloud:
  aws:
    s3:
      bucket: test-bucket
